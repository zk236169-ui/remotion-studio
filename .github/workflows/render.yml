name: Render Remotion Video to Telegram

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Video prompt or "create a video"'
        required: true
        default: 'create a video'
      chat_id:
        description: 'Telegram Chat ID to send video to'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  render-and-send:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux Chrome & FFmpeg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64
          pip install edge-tts

      - name: Install Node packages
        run: npm ci

      - name: Generate AI Script, Verified Clips & Architectural Visuals
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python3 scripts/cloud_generate.py "${{ github.event.inputs.prompt }}"

      - name: Save Topic Rotation History
        if: success()
        run: |
          git config user.name "Khyber Bot"
          git config user.email "bot@khyberpaints.local"
          git add scripts/used_topics.json
          git diff --staged --quiet || (git commit -m "Track used topic" && git push)

      - name: Send Finished Video Directly to Telegram
        if: success()
        run: |
          TARGET_CHAT="${{ github.event.inputs.chat_id }}"
          if [ -z "$TARGET_CHAT" ]; then TARGET_CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"; fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo" \
            -F chat_id="$TARGET_CHAT" \
            -F caption="Ready! New video for Khyber Paints Riyadh" \
            -F video=@"out/final_telegram_video.mp4"

      - name: Notify Telegram on Failure
        if: failure()
        run: |
          TARGET_CHAT="${{ github.event.inputs.chat_id }}"
          if [ -z "$TARGET_CHAT" ]; then TARGET_CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"; fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="$TARGET_CHAT" \
            -d text="Render failed on GitHub. Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"